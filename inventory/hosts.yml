---
# Network source of truth: which devices exist, how to reach them, and
# which environment they belong to. The "network_test" group is a lab/
# pre-production group that the CI/CD pipeline's dry-run and first real
# rollout always target before "network_prod" is touched.
all:
  children:
    network_baseline_devices:
      vars:
        ansible_network_os: cisco.ios.ios
        ansible_connection: ansible.netcommon.network_cli
        ansible_user: "{{ vault_ansible_user }}"
        ansible_password: "{{ vault_ansible_password }}"
        ansible_become: true
        ansible_become_method: enable
        ansible_become_password: "{{ vault_ansible_become_password }}"
      children:
        network_test:
          hosts:
            test-sw01:
              ansible_host: 10.10.0.101
            test-sw02:
              ansible_host: 10.10.0.102
        network_prod:
          hosts:
            prod-sw01:
              ansible_host: 10.20.0.11
            prod-sw02:
              ansible_host: 10.20.0.12
        # A local, in-process Cisco-IOS-like SSH server
        # (tests/mock_device/mock_ios_ssh_server.py) used to run the
        # playbooks genuinely end-to-end - real SSH, real network_cli
        # connection, real cisco.ios plugins - with no lab or real
        # device needed. See `make e2e`. All connection values are set
        # directly here (not via vault_*) so it needs no vault file.
        network_mock:
          hosts:
            mock-sw01:
              ansible_host: 127.0.0.1
              ansible_port: 8022
              ansible_user: netops
              ansible_password: C1sco12345
              ansible_become_password: C1sco12345enable
              vault_snmp_ro_community: public-ro
              vault_snmp_trap_community: trap-community
