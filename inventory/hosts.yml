---
# Network source of truth: which devices exist, how to reach them, and
# which environment they belong to. The "network_test" group is a lab/
# pre-production group that the CI/CD pipeline's dry-run and first real
# rollout always target before "network_prod" is touched.
all:
  children:
    network_baseline_devices:
      vars:
        ansible_network_os: cisco.ios.ios
        ansible_connection: ansible.netcommon.network_cli
        ansible_user: "{{ vault_ansible_user }}"
        ansible_password: "{{ vault_ansible_password }}"
        ansible_become: true
        ansible_become_method: enable
        ansible_become_password: "{{ vault_ansible_become_password }}"
      children:
        network_test:
          hosts:
            test-sw01:
              ansible_host: 10.10.0.101
            test-sw02:
              ansible_host: 10.10.0.102
        network_prod:
          hosts:
            prod-sw01:
              ansible_host: 10.20.0.11
            prod-sw02:
              ansible_host: 10.20.0.12
