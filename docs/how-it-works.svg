<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="Five steps, in order: write the standard once, check what's actually on the device, show the plan for what would change, make only the change that's needed, then check again and keep a record. Only step 4 changes anything on the device.">
  <title>How it works: five steps, only one of which changes anything</title>

  <rect x="0" y="0" width="1200" height="260" fill="#FCFCFB"/>

  <defs>
    <marker id="howArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C93AE"/>
    </marker>
  </defs>

  <!-- connecting arrows -->
  <line x1="220" y1="78" x2="256" y2="78" stroke="#7C93AE" stroke-width="1.6" marker-end="url(#howArrow)"/>
  <line x1="460" y1="78" x2="496" y2="78" stroke="#7C93AE" stroke-width="1.6" marker-end="url(#howArrow)"/>
  <line x1="700" y1="78" x2="736" y2="78" stroke="#7C93AE" stroke-width="1.6" marker-end="url(#howArrow)"/>
  <line x1="940" y1="78" x2="976" y2="78" stroke="#7C93AE" stroke-width="1.6" marker-end="url(#howArrow)"/>

  <!-- ===== card 1: write the standard ===== -->
  <g>
    <rect x="20" y="20" width="200" height="212" rx="14" fill="#F4F7FA" stroke="#7C93AE" stroke-width="1.4"/>
    <circle cx="44" cy="44" r="14" fill="#FFFFFF" stroke="#7C93AE" stroke-width="1.3"/>
    <text x="44" y="49" text-anchor="middle" font-size="12" font-weight="700" fill="#3E4C63">1</text>

    <path d="M100,53 h30 l14,14 v36 h-44 z" fill="#FFFFFF" stroke="#3E4C63" stroke-width="1.4"/>
    <path d="M130,53 v14 h14 z" fill="#DCE6F0" stroke="#3E4C63" stroke-width="1"/>
    <line x1="106" y1="79" x2="136" y2="79" stroke="#3E4C63" stroke-width="1.6"/>
    <line x1="106" y1="88" x2="130" y2="88" stroke="#3E4C63" stroke-width="1.6"/>
    <line x1="106" y1="97" x2="134" y2="97" stroke="#3E4C63" stroke-width="1.6"/>

    <text x="120" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#23293A">Write the standard</text>
    <text x="120" y="178" text-anchor="middle" font-size="11" fill="#667085">What every device</text>
    <text x="120" y="192" text-anchor="middle" font-size="11" fill="#667085">should have</text>
  </g>

  <!-- ===== card 2: check first ===== -->
  <g>
    <rect x="260" y="20" width="200" height="212" rx="14" fill="#F4F7FA" stroke="#7C93AE" stroke-width="1.4"/>
    <circle cx="284" cy="44" r="14" fill="#FFFFFF" stroke="#7C93AE" stroke-width="1.3"/>
    <text x="284" y="49" text-anchor="middle" font-size="12" font-weight="700" fill="#3E4C63">2</text>

    <circle cx="352" cy="70" r="16" fill="#FFFFFF" stroke="#3E4C63" stroke-width="2"/>
    <line x1="363" y1="81" x2="378" y2="96" stroke="#3E4C63" stroke-width="3.2" stroke-linecap="round"/>

    <text x="360" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#23293A">Check first</text>
    <text x="360" y="178" text-anchor="middle" font-size="11" fill="#667085">See what's actually</text>
    <text x="360" y="192" text-anchor="middle" font-size="11" fill="#667085">on the device</text>
  </g>

  <!-- ===== card 3: show the plan ===== -->
  <g>
    <rect x="500" y="20" width="200" height="212" rx="14" fill="#F4F7FA" stroke="#7C93AE" stroke-width="1.4"/>
    <circle cx="524" cy="44" r="14" fill="#FFFFFF" stroke="#7C93AE" stroke-width="1.3"/>
    <text x="524" y="49" text-anchor="middle" font-size="12" font-weight="700" fill="#3E4C63">3</text>

    <rect x="580" y="53" width="40" height="48" rx="4" fill="#FFFFFF" stroke="#3E4C63" stroke-width="1.4"/>
    <rect x="592" y="49" width="16" height="9" rx="2" fill="#DCE6F0" stroke="#3E4C63" stroke-width="1"/>
    <rect x="587" y="71" width="4" height="4" fill="#3E4C63"/>
    <line x1="596" y1="73" x2="613" y2="73" stroke="#3E4C63" stroke-width="1.6"/>
    <rect x="587" y="82" width="4" height="4" fill="#3E4C63"/>
    <line x1="596" y1="84" x2="613" y2="84" stroke="#3E4C63" stroke-width="1.6"/>
    <rect x="587" y="93" width="4" height="4" fill="#C97A2C"/>
    <line x1="596" y1="95" x2="609" y2="95" stroke="#C97A2C" stroke-width="1.6"/>

    <text x="600" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#23293A">Show the plan</text>
    <text x="600" y="178" text-anchor="middle" font-size="11" fill="#667085">List exactly what</text>
    <text x="600" y="192" text-anchor="middle" font-size="11" fill="#667085">would change</text>
  </g>

  <!-- ===== card 4: make the change (the one step that touches a device) ===== -->
  <g>
    <rect x="740" y="20" width="200" height="212" rx="14" fill="#FCEFDD" stroke="#C97A2C" stroke-width="1.8"/>
    <circle cx="764" cy="44" r="14" fill="#FFFFFF" stroke="#C97A2C" stroke-width="1.3"/>
    <text x="764" y="49" text-anchor="middle" font-size="12" font-weight="700" fill="#7A4413">4</text>

    <rect x="815" y="60" width="50" height="26" rx="13" fill="#FFFFFF" stroke="#C97A2C" stroke-width="2"/>
    <circle cx="853" cy="73" r="9" fill="#C97A2C"/>

    <text x="840" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#7A4413">Make the change</text>
    <text x="840" y="178" text-anchor="middle" font-size="11" fill="#8A5A24">Only fixes what's</text>
    <text x="840" y="192" text-anchor="middle" font-size="11" fill="#8A5A24">actually wrong</text>
    <text x="840" y="212" text-anchor="middle" font-size="10" font-weight="700" fill="#C97A2C">the only step that touches a device</text>
  </g>

  <!-- ===== card 5: check again ===== -->
  <g>
    <rect x="980" y="20" width="200" height="212" rx="14" fill="#F4F7FA" stroke="#7C93AE" stroke-width="1.4"/>
    <circle cx="1004" cy="44" r="14" fill="#FFFFFF" stroke="#7C93AE" stroke-width="1.3"/>
    <text x="1004" y="49" text-anchor="middle" font-size="12" font-weight="700" fill="#3E4C63">5</text>

    <circle cx="1080" cy="76" r="22" fill="#FFFFFF" stroke="#3E4C63" stroke-width="1.6"/>
    <path d="M1069,77 l8,8 l16,-18" fill="none" stroke="#2F8558" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="1080" y="158" text-anchor="middle" font-size="14" font-weight="700" fill="#23293A">Check again</text>
    <text x="1080" y="178" text-anchor="middle" font-size="11" fill="#667085">Confirm it matches,</text>
    <text x="1080" y="192" text-anchor="middle" font-size="11" fill="#667085">keep a record</text>
  </g>
</svg>
