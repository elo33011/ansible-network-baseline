<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 365" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" role="img" aria-label="baseline.yml is the source of truth. Ansible reads it and runs five steps in order, each its own playbook except step 1: write the standard (the baseline.yml file itself), check first (precheck.yml), show the plan (dry_run.yml), make the change (deploy.yml, the only step that touches a device), and check again (validate.yml then postcheck.yml).">
  <title>How it works: one source of truth, run through Ansible as five ordered steps</title>

  <rect x="0" y="0" width="1200" height="365" fill="#FCFCFB"/>

  <defs>
    <marker id="howArrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7C93AE"/>
    </marker>
  </defs>

  <!-- ===== source of truth ===== -->
  <rect x="20" y="15" width="200" height="55" rx="10" fill="#EEF2F6" stroke="#7C93AE" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text x="120" y="40" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#23293A">baseline.yml</text>
  <text x="120" y="56" text-anchor="middle" font-size="9.5" fill="#667085">the source of truth</text>
  <line x1="120" y1="70" x2="120" y2="96" stroke="#7C93AE" stroke-width="1.6" marker-end="url(#howArrow)"/>

  <!-- connecting arrows between steps -->
  <line x1="220" y1="158" x2="256" y2="158" stroke="#7C93AE" stroke-width="1.6" marker-end="url(#howArrow)"/>
  <line x1="460" y1="158" x2="496" y2="158" stroke="#7C93AE" stroke-width="1.6" marker-end="url(#howArrow)"/>
  <line x1="700" y1="158" x2="736" y2="158" stroke="#7C93AE" stroke-width="1.6" marker-end="url(#howArrow)"/>
  <line x1="940" y1="158" x2="976" y2="158" stroke="#7C93AE" stroke-width="1.6" marker-end="url(#howArrow)"/>

  <!-- ===== card 1: write the standard (the file itself, not a playbook) ===== -->
  <g>
    <rect x="20" y="100" width="200" height="224" rx="14" fill="#F4F7FA" stroke="#7C93AE" stroke-width="1.4"/>
    <circle cx="44" cy="124" r="14" fill="#FFFFFF" stroke="#7C93AE" stroke-width="1.3"/>
    <text x="44" y="129" text-anchor="middle" font-size="12" font-weight="700" fill="#3E4C63">1</text>

    <path d="M100,133 h30 l14,14 v36 h-44 z" fill="#FFFFFF" stroke="#3E4C63" stroke-width="1.4"/>
    <path d="M130,133 v14 h14 z" fill="#DCE6F0" stroke="#3E4C63" stroke-width="1"/>
    <line x1="106" y1="159" x2="136" y2="159" stroke="#3E4C63" stroke-width="1.6"/>
    <line x1="106" y1="168" x2="130" y2="168" stroke="#3E4C63" stroke-width="1.6"/>
    <line x1="106" y1="177" x2="134" y2="177" stroke="#3E4C63" stroke-width="1.6"/>

    <text x="120" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#23293A">Write the standard</text>
    <text x="120" y="258" text-anchor="middle" font-size="11" fill="#667085">What every device</text>
    <text x="120" y="272" text-anchor="middle" font-size="11" fill="#667085">should have</text>
    <text x="120" y="304" text-anchor="middle" font-size="9" font-style="italic" fill="#8A93A3">the file above, not a playbook</text>
  </g>

  <!-- ===== card 2: check first -> precheck.yml ===== -->
  <g>
    <rect x="260" y="100" width="200" height="224" rx="14" fill="#F4F7FA" stroke="#7C93AE" stroke-width="1.4"/>
    <circle cx="284" cy="124" r="14" fill="#FFFFFF" stroke="#7C93AE" stroke-width="1.3"/>
    <text x="284" y="129" text-anchor="middle" font-size="12" font-weight="700" fill="#3E4C63">2</text>

    <circle cx="352" cy="150" r="16" fill="#FFFFFF" stroke="#3E4C63" stroke-width="2"/>
    <line x1="363" y1="161" x2="378" y2="176" stroke="#3E4C63" stroke-width="3.2" stroke-linecap="round"/>

    <text x="360" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#23293A">Check first</text>
    <text x="360" y="258" text-anchor="middle" font-size="11" fill="#667085">See what's actually</text>
    <text x="360" y="272" text-anchor="middle" font-size="11" fill="#667085">on the device</text>

    <rect x="300" y="290" width="120" height="20" rx="10" fill="#E3E9F0" stroke="#7C93AE" stroke-width="1"/>
    <text x="360" y="304" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#3E4C63">precheck.yml</text>
  </g>

  <!-- ===== card 3: show the plan -> dry_run.yml ===== -->
  <g>
    <rect x="500" y="100" width="200" height="224" rx="14" fill="#F4F7FA" stroke="#7C93AE" stroke-width="1.4"/>
    <circle cx="524" cy="124" r="14" fill="#FFFFFF" stroke="#7C93AE" stroke-width="1.3"/>
    <text x="524" y="129" text-anchor="middle" font-size="12" font-weight="700" fill="#3E4C63">3</text>

    <rect x="580" y="133" width="40" height="48" rx="4" fill="#FFFFFF" stroke="#3E4C63" stroke-width="1.4"/>
    <rect x="592" y="129" width="16" height="9" rx="2" fill="#DCE6F0" stroke="#3E4C63" stroke-width="1"/>
    <rect x="587" y="151" width="4" height="4" fill="#3E4C63"/>
    <line x1="596" y1="153" x2="613" y2="153" stroke="#3E4C63" stroke-width="1.6"/>
    <rect x="587" y="162" width="4" height="4" fill="#3E4C63"/>
    <line x1="596" y1="164" x2="613" y2="164" stroke="#3E4C63" stroke-width="1.6"/>
    <rect x="587" y="173" width="4" height="4" fill="#C97A2C"/>
    <line x1="596" y1="175" x2="609" y2="175" stroke="#C97A2C" stroke-width="1.6"/>

    <text x="600" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#23293A">Show the plan</text>
    <text x="600" y="258" text-anchor="middle" font-size="11" fill="#667085">List exactly what</text>
    <text x="600" y="272" text-anchor="middle" font-size="11" fill="#667085">would change</text>

    <rect x="540" y="290" width="120" height="20" rx="10" fill="#E3E9F0" stroke="#7C93AE" stroke-width="1"/>
    <text x="600" y="304" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#3E4C63">dry_run.yml</text>
  </g>

  <!-- ===== card 4: make the change -> deploy.yml (the one step that touches a device) ===== -->
  <g>
    <rect x="740" y="100" width="200" height="224" rx="14" fill="#FCEFDD" stroke="#C97A2C" stroke-width="1.8"/>
    <circle cx="764" cy="124" r="14" fill="#FFFFFF" stroke="#C97A2C" stroke-width="1.3"/>
    <text x="764" y="129" text-anchor="middle" font-size="12" font-weight="700" fill="#7A4413">4</text>

    <rect x="846" y="108" width="82" height="18" rx="9" fill="#C97A2C"/>
    <text x="887" y="121" text-anchor="middle" font-size="8.5" font-weight="700" fill="#FFFFFF">changes it</text>

    <rect x="815" y="140" width="50" height="26" rx="13" fill="#FFFFFF" stroke="#C97A2C" stroke-width="2"/>
    <circle cx="853" cy="153" r="9" fill="#C97A2C"/>

    <text x="840" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#7A4413">Make the change</text>
    <text x="840" y="258" text-anchor="middle" font-size="11" fill="#8A5A24">Only fixes what's</text>
    <text x="840" y="272" text-anchor="middle" font-size="11" fill="#8A5A24">actually wrong</text>

    <rect x="780" y="290" width="120" height="20" rx="10" fill="#F6DDBB" stroke="#C97A2C" stroke-width="1"/>
    <text x="840" y="304" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="9.5" fill="#7A4413">deploy.yml</text>
  </g>

  <!-- ===== card 5: check again -> validate.yml + postcheck.yml ===== -->
  <g>
    <rect x="980" y="100" width="200" height="224" rx="14" fill="#F4F7FA" stroke="#7C93AE" stroke-width="1.4"/>
    <circle cx="1004" cy="124" r="14" fill="#FFFFFF" stroke="#7C93AE" stroke-width="1.3"/>
    <text x="1004" y="129" text-anchor="middle" font-size="12" font-weight="700" fill="#3E4C63">5</text>

    <circle cx="1080" cy="156" r="22" fill="#FFFFFF" stroke="#3E4C63" stroke-width="1.6"/>
    <path d="M1069,157 l8,8 l16,-18" fill="none" stroke="#2F8558" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="1080" y="238" text-anchor="middle" font-size="14" font-weight="700" fill="#23293A">Check again</text>
    <text x="1080" y="258" text-anchor="middle" font-size="11" fill="#667085">Confirm it matches,</text>
    <text x="1080" y="272" text-anchor="middle" font-size="11" fill="#667085">keep a record</text>

    <rect x="1000" y="290" width="160" height="20" rx="10" fill="#E3E9F0" stroke="#7C93AE" stroke-width="1"/>
    <text x="1080" y="304" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="8.5" fill="#3E4C63">validate.yml + postcheck.yml</text>
  </g>

  <!-- ===== caption: Ansible + pipeline approach ===== -->
  <text x="600" y="350" text-anchor="middle" font-size="12.5" fill="#4A5361">Ansible reads <tspan font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700">baseline.yml</tspan> and runs steps 2&#8211;5 as separate playbooks, one at a time, in order.</text>
</svg>
