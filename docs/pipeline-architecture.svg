<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1160" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" role="img" aria-label="Each of the five pipeline jobs runs in its own isolated GitHub Actions VM and starts a brand-new mock IOS-XE device; precheck and deploy-dry-run seed it from the same static file in the repo, while deploy captures its device's real end state to a file, uploads it as a GitHub Actions artifact, and validate and postcheck each download that artifact to seed their own fresh device with deploy's actual result.">
  <title>CI pipeline architecture: one job per stage, one fresh mock device per job</title>

  <rect x="0" y="0" width="1180" height="1160" fill="#FCFCFB"/>

  <defs>
    <marker id="arrowInk" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5B6472"/>
    </marker>
    <marker id="arrowAccent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#B8651C"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="590" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1F2430">CI: one job per pipeline stage</text>
  <text x="590" y="55" text-anchor="middle" font-size="12.5" fill="#6B7280" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">each job is its own isolated VM &#8212; and starts its own brand-new mock IOS-XE device</text>

  <!-- ===== lint -> syntax-check ===== -->
  <rect x="440" y="82" width="140" height="42" rx="8" fill="#FFFFFF" stroke="#C7CCD4" stroke-width="1.4"/>
  <text x="510" y="107" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2430">lint</text>

  <rect x="620" y="82" width="160" height="42" rx="8" fill="#FFFFFF" stroke="#C7CCD4" stroke-width="1.4"/>
  <text x="700" y="107" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2430">syntax-check</text>

  <line x1="580" y1="103" x2="614" y2="103" stroke="#5B6472" stroke-width="1.4" marker-end="url(#arrowInk)"/>

  <!-- fork to precheck / deploy-dry-run -->
  <line x1="700" y1="124" x2="700" y2="150" stroke="#5B6472" stroke-width="1.4"/>
  <line x1="700" y1="150" x2="278" y2="150" stroke="#5B6472" stroke-width="1.4"/>
  <line x1="700" y1="150" x2="902" y2="150" stroke="#5B6472" stroke-width="1.4"/>
  <line x1="278" y1="150" x2="278" y2="176" stroke="#5B6472" stroke-width="1.4" marker-end="url(#arrowInk)"/>
  <line x1="902" y1="150" x2="902" y2="176" stroke="#5B6472" stroke-width="1.4" marker-end="url(#arrowInk)"/>

  <!-- ===== precheck job ===== -->
  <g>
    <rect x="110" y="180" width="320" height="230" rx="12" fill="#FFFFFF" stroke="#C7CCD4" stroke-width="1.4"/>
    <text x="270" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2430">precheck</text>
    <text x="270" y="225" text-anchor="middle" font-size="10.5" fill="#6B7280" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">job &#183; isolated VM</text>

    <!-- seed file icon -->
    <path d="M150,238 h96 l16,16 v28 h-112 z" fill="#F7E8D6" stroke="#C7CCD4" stroke-width="1"/>
    <path d="M246,238 v16 h16 z" fill="#EBD3B2" stroke="#C7CCD4" stroke-width="1"/>
    <text x="206" y="266" text-anchor="middle" font-size="9" fill="#4A5361">seed_running_config_</text>
    <text x="206" y="277" text-anchor="middle" font-size="9" fill="#4A5361">drift.txt <tspan fill="#8A93A3">(repo)</tspan></text>

    <line x1="206" y1="284" x2="206" y2="300" stroke="#B8651C" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowAccent)"/>

    <!-- mock server -->
    <rect x="140" y="302" width="260" height="72" rx="8" fill="#F4F6F9" stroke="#9AA4B2" stroke-width="1.3"/>
    <circle cx="156" cy="316" r="3" fill="#9AA4B2"/>
    <circle cx="167" cy="316" r="3" fill="#9AA4B2"/>
    <text x="270" y="336" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F2430">mock_ios_ssh_server.py</text>
    <text x="270" y="351" text-anchor="middle" font-size="9" fill="#6B7280" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">fresh process, own port</text>
    <text x="270" y="366" text-anchor="middle" font-size="9" fill="#6B7280" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">check_mode: forced (read-only)</text>

    <text x="270" y="399" text-anchor="middle" font-size="10" fill="#4A5361">runs: <tspan font-weight="700">precheck.yml</tspan></text>
  </g>

  <!-- ===== deploy-dry-run job ===== -->
  <g>
    <rect x="750" y="180" width="320" height="230" rx="12" fill="#FFFFFF" stroke="#C7CCD4" stroke-width="1.4"/>
    <text x="910" y="208" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2430">deploy-dry-run</text>
    <text x="910" y="225" text-anchor="middle" font-size="10.5" fill="#6B7280" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">job &#183; isolated VM</text>

    <path d="M790,238 h96 l16,16 v28 h-112 z" fill="#F7E8D6" stroke="#C7CCD4" stroke-width="1"/>
    <path d="M886,238 v16 h16 z" fill="#EBD3B2" stroke="#C7CCD4" stroke-width="1"/>
    <text x="846" y="266" text-anchor="middle" font-size="9" fill="#4A5361">seed_running_config_</text>
    <text x="846" y="277" text-anchor="middle" font-size="9" fill="#4A5361">drift.txt <tspan fill="#8A93A3">(repo)</tspan></text>

    <line x1="846" y1="284" x2="846" y2="300" stroke="#B8651C" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowAccent)"/>

    <rect x="780" y="302" width="260" height="72" rx="8" fill="#F4F6F9" stroke="#9AA4B2" stroke-width="1.3"/>
    <circle cx="796" cy="316" r="3" fill="#9AA4B2"/>
    <circle cx="807" cy="316" r="3" fill="#9AA4B2"/>
    <text x="910" y="336" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F2430">mock_ios_ssh_server.py</text>
    <text x="910" y="351" text-anchor="middle" font-size="9" fill="#6B7280" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">fresh process, own port</text>
    <text x="910" y="366" text-anchor="middle" font-size="9" fill="#6B7280" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">check_mode: forced (read-only)</text>

    <text x="910" y="399" text-anchor="middle" font-size="10" fill="#4A5361">runs: <tspan font-weight="700">dry_run.yml</tspan></text>
  </g>

  <!-- convergence to deploy -->
  <line x1="270" y1="410" x2="270" y2="434" stroke="#5B6472" stroke-width="1.4"/>
  <line x1="270" y1="434" x2="590" y2="434" stroke="#5B6472" stroke-width="1.4"/>
  <line x1="910" y1="410" x2="910" y2="434" stroke="#5B6472" stroke-width="1.4"/>
  <line x1="910" y1="434" x2="590" y2="434" stroke="#5B6472" stroke-width="1.4"/>
  <line x1="590" y1="434" x2="590" y2="458" stroke="#5B6472" stroke-width="1.4" marker-end="url(#arrowInk)"/>

  <!-- ===== deploy job ===== -->
  <g>
    <rect x="360" y="460" width="460" height="260" rx="12" fill="#FFFFFF" stroke="#C7CCD4" stroke-width="1.6"/>
    <text x="590" y="490" text-anchor="middle" font-size="16" font-weight="700" fill="#1F2430">deploy</text>
    <text x="590" y="508" text-anchor="middle" font-size="10.5" fill="#6B7280" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">job &#183; isolated VM &#183; the only stage that changes a device</text>

    <path d="M530,520 h96 l16,16 v22 h-112 z" fill="#F7E8D6" stroke="#C7CCD4" stroke-width="1"/>
    <path d="M626,520 v16 h16 z" fill="#EBD3B2" stroke="#C7CCD4" stroke-width="1"/>
    <text x="586" y="538" text-anchor="middle" font-size="9" fill="#4A5361">seed_running_config_</text>
    <text x="586" y="549" text-anchor="middle" font-size="9" fill="#4A5361">drift.txt <tspan fill="#8A93A3">(repo)</tspan></text>

    <line x1="590" y1="560" x2="590" y2="576" stroke="#B8651C" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowAccent)"/>

    <rect x="430" y="578" width="320" height="60" rx="8" fill="#F4F6F9" stroke="#9AA4B2" stroke-width="1.3"/>
    <circle cx="446" cy="592" r="3" fill="#9AA4B2"/>
    <circle cx="457" cy="592" r="3" fill="#9AA4B2"/>
    <text x="590" y="610" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F2430">mock_ios_ssh_server.py</text>
    <text x="590" y="625" text-anchor="middle" font-size="9" fill="#6B7280" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">fresh process &#183; started with --state-file</text>

    <text x="590" y="655" text-anchor="middle" font-size="10" fill="#4A5361">runs: <tspan font-weight="700">deploy.yml</tspan> &#8212; pushes the diff for real</text>

    <path d="M530,665 h96 l16,16 v20 h-112 z" fill="#FBEFE0" stroke="#B8651C" stroke-width="1"/>
    <path d="M626,665 v16 h16 z" fill="#F2D9B4" stroke="#B8651C" stroke-width="1"/>
    <text x="590" y="690" text-anchor="middle" font-size="9.5" font-weight="600" fill="#7A4413">device_state.cfg</text>
    <text x="590" y="710" text-anchor="middle" font-size="9" fill="#6B7280" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">rewritten on every config change</text>
  </g>

  <line x1="590" y1="720" x2="590" y2="756" stroke="#B8651C" stroke-width="2.2" marker-end="url(#arrowAccent)"/>
  <text x="612" y="742" font-size="10" fill="#B8651C" font-weight="600">upload</text>

  <!-- ===== artifact ===== -->
  <g>
    <rect x="390" y="758" width="400" height="92" rx="10" fill="#FBEFE0" stroke="#B8651C" stroke-width="1.8"/>
    <ellipse cx="590" cy="778" rx="16" ry="6" fill="none" stroke="#B8651C" stroke-width="1.3"/>
    <path d="M574,778 v10 a16,6 0 0 0 32,0 v-10" fill="none" stroke="#B8651C" stroke-width="1.3"/>
    <text x="620" y="783" font-size="10" fill="#7A4413" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">GitHub Actions artifact</text>
    <text x="590" y="815" text-anchor="middle" font-size="14" font-weight="700" fill="#7A4413">post-deploy-device-state</text>
    <text x="590" y="833" text-anchor="middle" font-size="9.5" fill="#8A5A24" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">deploy's device_state.cfg, exactly as deploy.yml left it</text>
  </g>

  <!-- fork to validate / postcheck -->
  <line x1="590" y1="850" x2="590" y2="874" stroke="#B8651C" stroke-width="2.2"/>
  <line x1="590" y1="874" x2="270" y2="874" stroke="#B8651C" stroke-width="2.2"/>
  <line x1="590" y1="874" x2="910" y2="874" stroke="#B8651C" stroke-width="2.2"/>
  <line x1="270" y1="874" x2="270" y2="898" stroke="#B8651C" stroke-width="2.2" marker-end="url(#arrowAccent)"/>
  <line x1="910" y1="874" x2="910" y2="898" stroke="#B8651C" stroke-width="2.2" marker-end="url(#arrowAccent)"/>
  <text x="220" y="890" text-anchor="end" font-size="10" fill="#B8651C" font-weight="600">download &#8594; --seed</text>
  <text x="960" y="890" font-size="10" fill="#B8651C" font-weight="600">download &#8594; --seed</text>

  <!-- ===== validate job ===== -->
  <g>
    <rect x="110" y="900" width="320" height="170" rx="12" fill="#FFFFFF" stroke="#C7CCD4" stroke-width="1.4"/>
    <text x="270" y="928" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2430">validate</text>
    <text x="270" y="945" text-anchor="middle" font-size="10.5" fill="#6B7280" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">job &#183; isolated VM</text>

    <rect x="140" y="958" width="260" height="72" rx="8" fill="#F4F6F9" stroke="#9AA4B2" stroke-width="1.3"/>
    <circle cx="156" cy="972" r="3" fill="#9AA4B2"/>
    <circle cx="167" cy="972" r="3" fill="#9AA4B2"/>
    <text x="270" y="992" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F2430">mock_ios_ssh_server.py</text>
    <text x="270" y="1007" text-anchor="middle" font-size="9" fill="#6B7280" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">fresh process, seeded from</text>
    <text x="270" y="1019" text-anchor="middle" font-size="9" fill="#6B7280" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">the downloaded artifact</text>

    <text x="270" y="1055" text-anchor="middle" font-size="10" fill="#4A5361">runs: <tspan font-weight="700">validate.yml</tspan></text>
  </g>

  <!-- ===== postcheck job ===== -->
  <g>
    <rect x="750" y="900" width="320" height="170" rx="12" fill="#FFFFFF" stroke="#C7CCD4" stroke-width="1.4"/>
    <text x="910" y="928" text-anchor="middle" font-size="15" font-weight="700" fill="#1F2430">postcheck</text>
    <text x="910" y="945" text-anchor="middle" font-size="10.5" fill="#6B7280" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">job &#183; isolated VM</text>

    <rect x="780" y="958" width="260" height="72" rx="8" fill="#F4F6F9" stroke="#9AA4B2" stroke-width="1.3"/>
    <circle cx="796" cy="972" r="3" fill="#9AA4B2"/>
    <circle cx="807" cy="972" r="3" fill="#9AA4B2"/>
    <text x="910" y="992" text-anchor="middle" font-size="10.5" font-weight="600" fill="#1F2430">mock_ios_ssh_server.py</text>
    <text x="910" y="1007" text-anchor="middle" font-size="9" fill="#6B7280" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">fresh process, seeded from</text>
    <text x="910" y="1019" text-anchor="middle" font-size="9" fill="#6B7280" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">the downloaded artifact</text>

    <text x="910" y="1055" text-anchor="middle" font-size="10" fill="#4A5361">runs: <tspan font-weight="700">postcheck.yml</tspan></text>
  </g>

  <!-- ===== legend ===== -->
  <line x1="110" y1="1096" x2="150" y2="1096" stroke="#5B6472" stroke-width="1.4" marker-end="url(#arrowInk)"/>
  <text x="160" y="1100" font-size="10.5" fill="#4A5361" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif"><tspan font-weight="700">needs:</tspan> execution order (no data carried)</text>

  <line x1="110" y1="1120" x2="150" y2="1120" stroke="#B8651C" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowAccent)"/>
  <text x="160" y="1124" font-size="10.5" fill="#4A5361" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">reads the <tspan font-weight="700">same static repo file</tspan> &#8212; independently, nothing shared</text>

  <line x1="610" y1="1120" x2="650" y2="1120" stroke="#B8651C" stroke-width="2.2" marker-end="url(#arrowAccent)"/>
  <text x="660" y="1124" font-size="10.5" fill="#4A5361" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">GitHub Actions <tspan font-weight="700">artifact</tspan> &#8212; deploy's actual result, handed to validate &amp; postcheck</text>
</svg>
