---
- name: Determine timestamp for this run (once per play, shared across hosts)
  ansible.builtin.set_fact:
    network_baseline_run_timestamp: "{{ network_baseline_run_timestamp | default(lookup('pipe', 'date +%Y%m%d_%H%M%S')) }}"

- name: Render candidate configuration from the data model
  ansible.builtin.import_tasks: render.yml

- name: Read-only check (precheck / dry_run / validate / postcheck)
  ansible.builtin.import_tasks: check_only.yml
  when: network_baseline_stage in ['precheck', 'dry_run', 'validate', 'postcheck']

- name: Push the baseline configuration for real
  ansible.builtin.import_tasks: apply.yml
  when: network_baseline_stage == 'deploy'

- name: Save the post-deploy audit snapshot
  ansible.builtin.import_tasks: save_audit_snapshot.yml
  when: network_baseline_stage == 'postcheck'
