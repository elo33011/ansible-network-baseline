---
# Reconciles each device's configuration with the baseline data model,
# pushing only the lines that differ (diff-based, idempotent).
#
#   Dry run (no changes, shows the diff that would apply):
#     ansible-playbook playbooks/deploy_baseline.yml --check --diff --limit network_test
#
#   Real run:
#     ansible-playbook playbooks/deploy_baseline.yml --diff --limit network_test
#
# Always target network_test before network_prod. See README.md for the
# full pipeline: CI lint/syntax/unit-tests -> merge -> dry run against
# network_test -> apply to network_test -> dry run against network_prod ->
# apply to network_prod.
- name: Deploy baseline configuration to network devices
  hosts: network_baseline_devices
  gather_facts: false
  vars:
    network_baseline_mode: deploy
  roles:
    - network_baseline
