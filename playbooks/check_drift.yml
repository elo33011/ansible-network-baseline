---
# Read-only baseline drift check. NEVER changes a device, regardless of
# how it's invoked (check_mode is hard-coded in the role's drift-check
# task). Safe to run anytime, and this is the job the CI/CD pipeline runs
# against the "network_test" group before anyone is allowed to deploy.
#
#   ansible-playbook playbooks/check_drift.yml --limit network_test
#
# By default this playbook FAILS (non-zero exit) when drift is found, so
# it works as a CI gate. To only warn:
#
#   ansible-playbook playbooks/check_drift.yml --limit network_test \
#     -e network_baseline_fail_on_drift=false
- name: Check baseline configuration drift
  hosts: network_baseline_devices
  gather_facts: false
  vars:
    network_baseline_mode: check
  roles:
    - network_baseline
