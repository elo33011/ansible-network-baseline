name: CI

# Develop-and-test pipeline: lints and tests the playbooks/role/templates
# on every push and pull request, using ONLY GitHub-hosted runners (no
# network device access needed). This is the gate that must be green
# before anyone runs the deploy workflow (deploy.yml) against real
# devices.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible + lint tools
        run: pip install "ansible-core>=2.15,<2.20" ansible-lint yamllint

      - name: Install required collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint playbooks roles

  syntax-check:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible
        run: pip install "ansible-core>=2.15,<2.20"

      - name: Install required collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Syntax-check the 5-stage pipeline playbooks
        run: make syntax-check

  e2e-mock-device:
    needs: syntax-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible + SSH client library
        run: pip install "ansible-core>=2.15,<2.20" paramiko

      - name: Install required collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Install mock device server dependencies
        run: pip install -r tests/mock_device/requirements.txt

      - name: Run the real 5-stage pipeline end-to-end against a mock IOS-XE device
        # tests/mock_device/mock_ios_ssh_server.py is a local SSH server on
        # 127.0.0.1 speaking just enough real Cisco IOS CLI for
        # ansible.netcommon's network_cli connection + cisco.ios's
        # cliconf/terminal plugins to drive it - so this exercises the
        # actual pipeline playbooks (precheck.yml, dry_run.yml, deploy.yml,
        # validate.yml, postcheck.yml) over a real SSH connection, with no
        # lab or reachable device needed. See tests/mock_device/run_e2e.sh
        # for the per-stage assertions this makes.
        run: make e2e

  # After this workflow is green on the main branch, the deploy workflow
  # (deploy.yml) can be run by hand - apply=false runs precheck + dry_run
  # only (read-only); apply=true runs all 5 stages (precheck, dry_run,
  # deploy, validate, postcheck). For real devices, adapt deploy.yml per
  # the README's "Deploying to real devices" section (self-hosted
  # runner, --limit network_test/network_prod, and for network_prod the
  # "network-production" GitHub Environment's required reviewers).
