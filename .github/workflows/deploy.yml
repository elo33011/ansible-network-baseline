name: Deploy

# Runs on a plain GitHub-hosted runner (ubuntu-latest) against the mock
# IOS-XE SSH server (tests/mock_device/mock_ios_ssh_server.py) - the same
# one CI's precheck/deploy-dry-run/deploy/validate/postcheck jobs use.
# That's what makes ubuntu-latest
# viable here at all: ansible.netcommon.cli_config connects directly over
# SSH, and a GitHub-hosted runner has no route to a real device's private
# management IP - only to this loopback mock. No self-hosted runner, no
# vault, no real device needed; this demonstrates the actual 5-stage
# pipeline (precheck -> dry_run -> deploy -> validate -> postcheck) as a
# real GitHub Actions deploy, not just a CI assertion.
#
# This workflow is only meant to be run after "CI" (ci.yml) is green on
# the commit being deployed - enforce that with a branch protection rule
# requiring that check on `main`. precheck and dry_run always run
# (read-only); deploy, validate and postcheck only run when the "apply"
# input is checked.
#
# To deploy to REAL devices on a private network instead of the mock,
# this needs a self-hosted runner with SSH reachability to them - see
# ci/setup-self-hosted-runner.sh and the "Deploying to real devices"
# section of docs/DEVELOPMENT.md for the vault-backed variant of this
# workflow (`runs-on: [self-hosted, network]`, `--limit
# network_test`/`network_prod`, ANSIBLE_VAULT_* secrets).

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply changes (unchecked = precheck + dry run only)'
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ansible + SSH client library
        run: pip install "ansible-core>=2.15,<2.20" paramiko

      - name: Install required collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Install mock device server dependencies
        run: pip install -r tests/mock_device/requirements.txt

      - name: Start the mock IOS-XE SSH server (seeded with drift)
        run: |
          python3 tests/mock_device/mock_ios_ssh_server.py \
            --seed tests/mock_device/seed_running_config_drift.txt \
            --ready-file /tmp/mock_ready &
          for i in $(seq 1 50); do [ -s /tmp/mock_ready ] && break; sleep 0.2; done
          test -s /tmp/mock_ready

      - name: "Stage 1/5: precheck (informational - never blocks this workflow)"
        run: |
          ansible-playbook playbooks/precheck.yml \
            --limit network_mock \
            -e network_baseline_fail_on_drift=false

      - name: "Stage 2/5: dry run (always, shows the diff that would be applied)"
        run: |
          ansible-playbook playbooks/dry_run.yml \
            --diff \
            --limit network_mock

      - name: "Stage 3/5: deploy (the actual push)"
        if: ${{ inputs.apply }}
        run: |
          ansible-playbook playbooks/deploy.yml \
            --diff \
            --limit network_mock

      - name: "Stage 4/5: validate (fails if drift remains after deploy)"
        if: ${{ inputs.apply }}
        run: |
          ansible-playbook playbooks/validate.yml \
            --limit network_mock

      - name: "Stage 5/5: postcheck (fails if drift remains, records the audit snapshot)"
        if: ${{ inputs.apply }}
        run: |
          ansible-playbook playbooks/postcheck.yml \
            --limit network_mock

      - name: Upload rendered configs and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: network-baseline-reports-${{ github.run_id }}
          path: |
            reports/rendered/
            reports/drift/
            reports/postcheck/
          if-no-files-found: ignore
